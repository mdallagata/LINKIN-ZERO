name: CI

on:
  pull_request:
  push:
    branches: [prod]
  # Todos los días a las 06:00 de Tucumán (09:00 UTC) se regenera y deploya el
  # sitio: la separación entre próximos shows y anteriores se calcula al
  # generarlo, así que un show pasa solo a "anteriores" al día siguiente.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, formato, tipos, build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec tsc --noEmit

      # Las versiones redimensionadas de las fotos se reusan entre corridas: el
      # script compara el hash de cada foto y solo regenera las que cambiaron.
      - uses: actions/cache@v6
        with:
          path: |
            public/generated
            .cache/generated-images.json
          key: images-${{ hashFiles('public/images/**', 'scripts/generate-images.mts', 'src/lib/image-sizes.json', 'src/lib/generated-image-path.ts') }}
          restore-keys: images-
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      # El deploy publica exactamente este build, el que pasó los tests.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 1

  deploy:
    name: Deploy a Cloudflare Workers
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
