allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: false
  unrs-resolver: true
  workerd: true
# eslint-config-next soporta ESLint 10 (node_modules/next/dist/docs/01-app/03-api-reference/05-config/03-eslint.md),
# pero estos plugins que trae todavía no lo declaran en sus peerDependencies.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
